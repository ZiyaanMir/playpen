# MARSHAL self-play behavior toggle. The single switch to flip BEFORE starting a
# training run. Maps 1:1 onto playpen.marshal.MarshalConfig.
#
# Quick off switch without editing this file: pass --no-marshal on the CLI.

# Master on/off switch. False => plain TRL GRPO (one scalar terminal reward per
# rollout, TRL's own group-relative normalization). Fields marked "applies
# REGARDLESS of `enabled`" below still take effect; the rest do not.
enabled: true

# Pool/normalize advantages per self-play seat (player_0 rows separately from
# player_1 rows) -- MARSHAL's "agent-specific advantage normalization".
# False => pool batch-wide (ablation).
agent_specific_normalization: true

# "mean" mean-centers each pool; "mean_std" z-scores it.
advantage_norm_mode: mean

# Discount for the backward return. MARSHAL uses 1.0.
gamma: 1.0

# How a multi-turn rollout row's token sequence is assembled. Applies REGARDLESS of
# `enabled` -- it governs rollout collection, shared by the MARSHAL path and the
# plain-GRPO baseline.
#
# "exact"   (default, and the only setting to use for new runs): the row's
#           prompt+completion tokens reproduce, token for token, the context each turn
#           was generated under.
#
# "spliced" (kept only to reproduce old runs): raw env text spliced into the row with
#           no chat scaffolding, while generation used a freshly rendered chat
#           template. From turn 2 onward the trained sequence is NOT the generated
#           one, so recomputed log-probs diverge and TRL's vLLM importance-sampling
#           correction collapses each row's gradient.
row_context_mode: exact

# Whether the seats of one episode share that episode. Also applies REGARDLESS of
# `enabled`.
#
# "shared" (default, and what MARSHAL itself does): one dataset row per game instance.
#           TRL repeats each row `num_generations` times consecutively, and each run of
#           `num_players` copies is served by ONE episode -- seat k takes the k-th copy.
#           Both seats of a pair come from the same game, no seat is generated and
#           thrown away, and every advantage pool holds the seats in equal number.
#           Pick `num_generations` as a multiple of the game's player count; runs that
#           cannot be paired fall back to "replay" for those rows.
#
# "replay"  (pre-fix behaviour): one dataset row per (instance, seat); every prompt
#           replays a whole fresh episode and keeps only the requested seat.
episode_pairing: shared

# Sampling-tail truncation, mapped onto TRL's GRPOConfig.top_p / top_k. Applies
# REGARDLESS of `enabled`. CLI: --sampling-top-p / --sampling-top-k, or
# --no-sampling-truncation to revert to TRL's untruncated defaults (1.0 / 0).
#
# These are not TRL's defaults because with kl_beta 0 the policy's entropy collapses
# as it learns. Sampling over the FULL vocabulary then occasionally draws a far-tail
# token, where log p is so sensitive to a small bf16 logit difference that vLLM and
# the training model disagree by many nats on that one token. TRL's
# vllm_importance_sampling_mode defaults to "sequence_mask", which SUMS the per-token
# divergence over the row and exponentiates it, so one tail token annihilates the
# whole row's gradient.
#
# This does NOT bias the importance ratio: vLLM computes the logprobs it reports from
# the raw logits BEFORE applying top-p/top-k, so both sides of the ratio remain
# full-distribution quantities -- only the sampled support narrows.
#
# Both are set because they fail differently on a collapsed policy: at a
# near-deterministic position top_p keeps only the argmax while top_k still admits
# ranks 2..50; at a genuinely uncertain position top_k bounds the support where top_p
# may keep a long tail.
#
# This is a MITIGATION. The root cause is training without a KL term, which MARSHAL's
# own shipped *_selfplay.yaml never does (use_kl_loss: true, kl_loss_coef: 0.20).
sampling_top_p: 0.95
sampling_top_k: 50

# Z-score the token-level reward field over all model-token positions (batch-wide,
# both seats pooled) BEFORE the backward cumulative sum. Mirrors ROLL's
# `whiten_rewards: true`, which every shipped MARSHAL *_selfplay.yaml enables -- a
# framework flag, not part of the paper's algorithm. With sparse terminal rewards this
# densifies the signal (every model token picks up -mean/std), adding a
# response-length-dependent component to the returns.
whiten_rewards: false

# Z-score the final advantages over all model-token positions (batch-wide) AFTER
# the per-seat normalization. Mirrors ROLL's `whiten_advantages: true` (also set
# in every shipped selfplay YAML). Standard PPO-style scale stabilization.
whiten_advantages: true

# Dr. GRPO (arXiv:2503.20783): TRL's unbiased-GRPO loss/scaling recipe --
# loss_type='dr_grpo' (loss normalized by the constant max_completion_length instead of
# realized length => no response-length bias) + scale_rewards='none' (advantages not
# divided by a std => no difficulty bias). CLI: --dr-grpo / --no-dr-grpo. Takes effect
# regardless of `enabled` and is applied by the launch script, NOT by the advantage math.
#
# Composes with MARSHAL, which already avoids std division by default
# (advantage_norm_mode: mean). Only advantage_norm_mode: mean_std is realigned back to
# `mean` (dropping the per-seat std divisor, keeping per-seat pooling), with a notice.
dr_grpo: false

# Original-GRPO loss aggregation: TRL's loss_type='grpo', i.e. each row's token losses
# averaged over that row's OWN length, then a mean over rows. Nothing else changes --
# scale_rewards keeps TRL's 'group' default and MARSHAL's advantage math is untouched.
# CLI: --grpo-loss / --no-grpo-loss. MUTUALLY EXCLUSIVE with dr_grpo (both set
# loss_type). Like dr_grpo, applies regardless of `enabled` and is set by the launch
# script.
#
# Why it exists: upstream MARSHAL is a ROLL fork whose shipped playpen selfplay YAMLs
# leave loss_agg_mode unset -> ROLL's 'seq-mean-token-sum' default, which is a per-row
# mean, i.e. TRL's 'grpo' rather than TRL's default 'dapo'.
#
# Cost of turning it on: every row gets weight 1/B whatever its length, so short turns
# carry far more gradient per token -- the length bias dapo and Dr. GRPO both remove.
# TRL also divides by the FULL row count while ROLL divides by its VALID-row count, so
# a placeholder row (an idle seat, a drifted row) scales the update by
# (1 - placeholder_rate) against upstream. Check marshal/rows/placeholder_rate.
grpo_loss: false

# ---------------------------------------------------------------------------
# Dense PER-TURN REWARDS (playpen/marshal/turn_rewards.py).
#
# Playpen is terminal-only out of the box: clemcore scores an episode SUCCESS +1 /
# FAILURE 0 / ABORTED -1 and hands that one team scalar to every seat's last turn.
# Turning this on adds a second, bounded reward channel read off the game's own live
# GameState after each step.
#
# Applies REGARDLESS of `enabled`: it governs rollout collection. On the plain-GRPO
# path (which sees only one scalar per row) the episode total is added to the terminal
# reward. Either way marshal/turn_rewards/terminal_mean logs the UNSHAPED outcome, so
# an arm with this on stays comparable with one that has it off.
#
# WHAT EACH GAME SUPPLIES (mirroring that game's own scorer definitions):
#   wordle     closeness -- how much of the target the guess revealed (green 5,
#              yellow 3), rewarded as the gain over the best guess so far; plus format.
#   codenames  board     -- words revealed this turn, weighted +1 team / -0.5 innocent
#              / -1 opponent / -2 assassin, normalized by the board's team count;
#              plus format.
#   taboo      format, clue -- which seat's turn broke the format or used a forbidden
#              word. No progress signal exists in this game.
#   guesswhat  format    -- malformed or disallowed question/answer.
#   dond       proposal, format -- committing a well-formed secret proposal; aborting.
#   (any other game)     -- generic format compliance, read from whichever validation
#              flags its GameState carries.
#
# It is also what makes agent_specific_normalization do real work: clembench gives
# BOTH seats the same team outcome, so per-seat pooling otherwise mean-centers two
# identical distributions. A per-turn reward is attributed to the seat that ACTED.
#
# CLI: --turn-rewards / --no-turn-rewards, --turn-reward-scale, --turn-reward-budget,
# --turn-reward-source, --turn-reward-components.
turn_rewards: false

# Which extractor supplies the signal.
#   "auto"    (default) the game's own extractor if registered, else generic format
#             compliance.
#   "game"    game-specific only; for an unregistered game turn rewards are simply
#             off (with a warning) rather than quietly falling back.
#   "generic" force format compliance even where a richer extractor exists -- the
#             "compliance only" ablation arm.
turn_reward_source: auto

# Multiplier on each turn's combined signal. Extractors normalize every component to
# [-1, 1], so this IS the most a single turn can contribute.
turn_reward_scale: 0.05

# Cap on |sum of one seat's shaping over one episode|, applied as a PROPORTIONAL
# rescale of the whole episode's shaping vector (relative credit between turns
# survives; no sign flips).
#
# This is what makes "cannot overwhelm the terminal reward" a guarantee. The MARSHAL
# return is a backward cumulative sum, so what competes with the +-1 outcome is the
# episode TOTAL. With budget < 0.5 the worst-case difference in shaping between two
# episodes is 2 x budget < 1.0, smaller than the gap between any two distinct
# clembench outcomes -- shaping can reorder episodes WITHIN an outcome class but never
# across one. 0 disables the cap and gives up that guarantee.
#
# A safety net, not the operating point: tune turn_reward_scale so a typical episode
# lands under it and watch marshal/turn_rewards/budget_clip_rate (near 1.0 means this
# field, not the game, is setting the magnitude).
turn_reward_budget: 0.3

# Comma-separated allowlist of component names, e.g. "closeness" to run wordle's
# progress signal without its format penalty, or "format" for a compliance-only arm.
# Empty keeps every component the extractor emits. An unknown name is an error at
# startup, not a silent no-op.
turn_reward_components: ""
