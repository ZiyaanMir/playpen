# MARSHAL self-play behavior toggle. This is the single, obvious switch to flip
# BEFORE starting a training run. It maps 1:1 onto playpen.marshal.MarshalConfig.
#
# Quick off switch without editing this file: pass --no-marshal on the CLI.

# Master on/off switch. False => plain TRL GRPO (one scalar terminal reward per
# rollout, TRL's own group-relative normalization). None of the fields below have
# any effect when this is False.
enabled: true

# Pool/normalize advantages per self-play seat (player_0 rows separately from
# player_1 rows) -- MARSHAL's headline "agent-specific advantage normalization".
# Set False to keep turn-level credit but pool batch-wide (ablation).
agent_specific_normalization: true

# Keep rewards at each turn boundary and turn them into per-token returns via a
# backward cumulative sum (turn-level advantage estimator). False => sum a seat's
# turn rewards into a single terminal scalar (MARSHAL use_turn_scores=False).
turn_level_rewards: true

# "mean" mean-centers each pool; "mean_std" z-scores it.
advantage_norm_mode: mean

# Discount for the backward return. MARSHAL uses 1.0.
gamma: 1.0

# How a multi-turn rollout row's token sequence is assembled. Like dr_grpo, this
# applies REGARDLESS of `enabled` -- it governs rollout collection, which the MARSHAL
# path and the plain-GRPO baseline share.
#
# "exact"   (default, and the only setting you should use for new runs): the row's
#           prompt+completion tokens reproduce, token for token, the context each turn
#           was generated under. Each turn's prompt is the row so far plus the chat
#           template's own per-turn scaffolding, and the environment span is read back
#           from the token ids vLLM reports, so nothing can drift unnoticed.
#
# "spliced" (pre-2026-07-25 behaviour, kept only to reproduce old runs): raw env text
#           spliced into the row with no chat scaffolding, while generation used a
#           freshly rendered chat template. From turn 2 onward the trained sequence is
#           NOT the generated one, recomputed log-probs diverge by ~0.6 nats/token, and
#           TRL's vLLM importance-sampling correction (sequence_mask, on by default)
#           multiplies each row's loss by exp(that divergence) -- measured at <=1e-6 for
#           every row in guesswhat_Qwen3-4B_no_kl, i.e. grad_norm ~1e-8 and no learning.
row_context_mode: exact

# Whether the seats of one episode share that episode. Also applies REGARDLESS of
# `enabled` -- it governs rollout collection.
#
# "shared" (default, and what MARSHAL itself does): one dataset row per game instance.
#           TRL repeats each row `num_generations` times consecutively, and each run of
#           `num_players` copies is served by ONE episode -- seat k takes the k-th copy.
#           Both seats of a pair therefore come from the same game (so a per-seat
#           baseline compares like with like), no seat is generated and thrown away
#           (~2x faster rollouts for a 2-player game), and every advantage pool holds
#           the seats in equal number instead of the 1:7..7:1 swings seen before.
#           Pick `num_generations` as a multiple of the game's player count; runs that
#           cannot be paired fall back to "replay" for those rows rather than failing.
#
# "replay"  (pre-fix behaviour): one dataset row per (instance, seat); every prompt
#           replays a whole fresh episode and keeps only the requested seat, so the
#           other seat's generation is wasted and the two seats of a "pair" come from
#           different games.
episode_pairing: shared

# Sampling-tail truncation, mapped onto TRL's GRPOConfig.top_p / top_k. Like dr_grpo
# and row_context_mode, this applies REGARDLESS of `enabled` -- it configures
# generation, which the MARSHAL path and the plain-GRPO baseline share.
# CLI: --sampling-top-p / --sampling-top-k, or --no-sampling-truncation to revert.
#
# WHY THESE ARE NOT TRL's DEFAULTS (1.0 / 0 = untruncated). With kl_beta 0 the policy's
# entropy collapses as it learns -- measured 0.091 -> 0.029 nats on guesswhat/Qwen3-4B
# over 700 steps. Sampling at temperature 1.0 over the FULL vocabulary then occasionally
# draws a far-tail token, and down there log p is so sensitive to a small bf16 logit
# difference that vLLM and the training model disagree by many nats on that single token
# (observed max 16.0). TRL's vllm_importance_sampling_mode defaults to "sequence_mask",
# which SUMS the per-token divergence over the row and exponentiates it -- so one tail
# token annihilates the whole row: the worst row's ratio hit 1.6e-14, and 0.0 outright
# (float underflow, not the >3.0 cap -- that never fired), while grad_norm decayed 7.7x.
# Across 5 runs / 350 logged steps, corr(1/entropy, logp-divergence) = +0.90.
#
# This does NOT bias the importance ratio. vLLM computes the logprobs it reports from the
# raw logits BEFORE applying top-p/top-k (vllm/v1/sample/sampler.py:74-86; logprobs_mode
# defaults to "raw_logprobs"), so both sides of the ratio remain full-distribution
# quantities -- only the sampled support narrows.
#
# Both are set because they fail differently on a collapsed policy: at a
# near-deterministic position top_p keeps only the argmax (correct -- there is no real
# choice there) while top_k still admits ranks 2..50; at a genuinely uncertain position
# top_k bounds the support where top_p may keep a long tail.
#
# This is a MITIGATION. The root cause is training without a KL term, which MARSHAL's own
# shipped *_selfplay.yaml never does (use_kl_loss: true, kl_loss_coef: 0.20).
# Set 1.0 / 0 (or pass --no-sampling-truncation) to reproduce pre-2026-07-28 generation:
# no key is then added to GRPOConfig at all.
sampling_top_p: 0.95
sampling_top_k: 50

# "paper_correct" (default): the algorithm the MARSHAL paper describes.
# "marshal_exact": bit-comparable reproduction of MARSHAL's shipped code,
#   including its two documented departures from its own paper (a biasing pre-sum
#   reward normalization, and distinct-value pooling that equal-weights rare and
#   common outcomes). Use only for comparison against MARSHAL's own numbers.
fidelity_mode: marshal_exact

# Z-score the token-level reward field over all model-token positions (batch-wide,
# both seats pooled) BEFORE the backward cumulative sum. Mirrors ROLL's
# `whiten_rewards: true`, which every shipped MARSHAL *_selfplay.yaml enables --
# a framework flag, not part of the paper's algorithm. NOTE: with sparse terminal
# rewards this densifies the signal (every model token picks up -mean/std), adding
# a response-length-dependent component to the returns.
whiten_rewards: true

# Z-score the final advantages over all model-token positions (batch-wide) AFTER
# the per-seat normalization. Mirrors ROLL's `whiten_advantages: true` (also set
# in every shipped selfplay YAML). Standard PPO-style scale stabilization.
whiten_advantages: true

# Dr. GRPO (arXiv:2503.20783): run with TRL's unbiased-GRPO loss/scaling recipe --
# loss_type='dr_grpo' (loss normalized by the constant max_completion_length instead of
# realized length => removes the response-length bias) + scale_rewards='none' (advantages
# not divided by a std => removes the difficulty bias). Quick CLI override: --dr-grpo /
# --no-dr-grpo. Unlike the fields above, this takes effect regardless of `enabled` (it
# configures the shared TRL recipe used by both the MARSHAL path and the --no-marshal
# baseline) and is applied by the launch script, NOT by the advantage math.
#
# Composes with MARSHAL: MARSHAL already avoids std division by default
# (advantage_norm_mode: mean), so turning this on keeps all MARSHAL features (turn-level
# credit, per-seat pooling, gamma, whitening). Only if you had set
# advantage_norm_mode: mean_std does dr_grpo align it back to `mean` (dropping the per-seat
# std divisor but keeping per-seat pooling), with a printed notice.
dr_grpo: false

# ---------------------------------------------------------------------------
# Dense PER-TURN REWARDS (playpen/marshal/turn_rewards.py).
#
# Playpen is terminal-only out of the box: clemcore scores an episode SUCCESS +1 /
# FAILURE 0 / ABORTED -1 and hands that one team scalar to every seat's last turn.
# Turning this on adds a second, bounded reward channel read off the game's own live
# GameState after each step -- the route clemcore itself suggests for game-specific
# rewards (see the reward_func docstring in its pettingzoo master).
#
# Like row_context_mode / episode_pairing / dr_grpo, this applies REGARDLESS of
# `enabled`: it governs rollout collection, which the MARSHAL path and the
# --no-marshal baseline share. On the MARSHAL path the signal lands at each turn
# boundary and gets full turn-level credit; on the plain-GRPO path (which sees only
# one scalar per row) the episode total is added to the terminal reward instead.
# Either way marshal/turn_rewards/terminal_mean logs the UNSHAPED outcome, so an arm
# with this on stays comparable with one that has it off.
#
# WHAT EACH GAME SUPPLIES (mirroring that game's own scorer definitions):
#   wordle     closeness -- how much of the target the guess revealed (clembench's
#              turns_closeness weights: green 5, yellow 3), rewarded as the gain over
#              the best guess so far, so repeating a guess earns nothing; plus format.
#   codenames  board     -- words revealed this turn, weighted +1 team / -0.5 innocent
#              / -1 opponent / -2 assassin, normalized by the board's team count;
#              plus format.
#   taboo      format, clue -- which seat's turn broke the format or used a forbidden
#              word. No progress signal exists in this game.
#   guesswhat  format    -- malformed or disallowed question/answer.
#   dond       proposal, format -- committing a well-formed secret proposal; aborting.
#   (any other game)     -- generic format compliance, read from whichever validation
#              flags its GameState carries.
#
# WHY IT IS WORTH TURNING ON, beyond denser credit across turns: clembench gives BOTH
# self-play seats the same team outcome, so agent_specific_normalization currently
# mean-centers two identical distributions and the per-seat split is a metric
# artifact. A per-turn reward is attributed to the seat that ACTED -- it is the only
# thing here that makes the two seats' advantages genuinely differ.
#
# CLI: --turn-rewards / --no-turn-rewards, --turn-reward-scale, --turn-reward-budget,
# --turn-reward-source, --turn-reward-components.
turn_rewards: false

# Which extractor supplies the signal.
#   "auto"    (default) the game's own extractor if registered, else generic format
#             compliance.
#   "game"    game-specific only; for an unregistered game turn rewards are simply
#             off (with a warning) rather than quietly falling back. Use this when a
#             result depends on the game-specific signal.
#   "generic" force format compliance even where a richer extractor exists -- the
#             "compliance only" ablation arm.
turn_reward_source: auto

# Multiplier on each turn's combined signal. Extractors normalize every component to
# [-1, 1], so this IS the most a single turn can contribute. At 0.05 a seat would
# need 20 maximally-shaped turns to match the magnitude of the game outcome, and no
# shipped preset plays that many.
turn_reward_scale: 0.05

# Cap on |sum of one seat's shaping over one episode|, applied as a PROPORTIONAL
# rescale of the whole episode's shaping vector (relative credit between turns
# survives; no sign flips).
#
# THIS IS THE KNOB THAT MAKES "CANNOT OVERWHELM THE TERMINAL REWARD" A GUARANTEE.
# The MARSHAL return is a backward cumulative sum, so what competes with the +-1
# outcome is the episode TOTAL, not the per-turn number. With budget < 0.5 the
# worst-case difference in shaping between two episodes is 2 x budget < 1.0, which is
# smaller than the gap between any two distinct clembench outcomes (SUCCESS-FAILURE =
# 1, FAILURE-ABORTED = 1). Shaping can therefore reorder episodes WITHIN an outcome
# class but never across one: a shaped loss can never out-score a bare win.
# 0 disables the cap and gives up that guarantee.
#
# It is a safety net, not the operating point. Tune turn_reward_scale so a typical
# episode lands under it and watch marshal/turn_rewards/budget_clip_rate: near 1.0
# means the cap binds every episode, i.e. this field -- not the game -- is setting
# your signal's magnitude and only its shape survives.
turn_reward_budget: 0.3

# Comma-separated allowlist of component names, e.g. "closeness" to run wordle's
# progress signal without its format penalty, or "format" for a compliance-only arm.
# Empty keeps every component the extractor emits. An unknown name is an error at
# startup (checked against the resolved extractor), not a silent no-op.
turn_reward_components: ""

# ---------------------------------------------------------------------------
# Per-turn length penalty (MARSHAL's Kimi-1.5-style compute_length_penalty,
# roll/agentic/rollout/env_manager.py:276-294). Added to each turn's reward
# BEFORE any normalization, so the pre-sum pass, whitening, the backward
# cumulative sum and the per-seat pooling all see it -- the same place MARSHAL
# adds it (env_manager.py:770-771).
#
#   raw   = offset - (turn_tokens - min_len) / (max_len - min_len)
#   score = raw * bonus   if raw > 0      (bonus 0.0 => no reward for brevity)
#           raw * coef    if raw < 0      (the penalty)
#
# With the shipped defaults this is a ONE-SIDED penalty: exactly 0 for any turn
# at or under max_len, then linear beyond it (~ -coef at 2x max_len).
#
# IMPORTANT: `false` is the MARSHAL-FAITHFUL setting. MARSHAL applies this only
# to its board-game envs and explicitly skips it for free-text ones --
# env_manager.py:470-480 guards it behind `not isinstance(env,
# BaseLanguageBasedEnv)`, commented "No MARSHAL-imposed reward shaping for
# free-text envs (e.g. Playpen/clembench)". Turning it on is a deliberate
# divergence, worth making against a reasoning model that overruns its budget,
# but a run using it is NOT a MARSHAL reproduction and should be reported as such.
#
# Only has an effect when `enabled: true` (it lives inside the MARSHAL advantage
# path). CLI overrides: --length-penalty / --no-length-penalty,
# --length-penalty-coef, --length-penalty-max-len, ...
# Watch marshal/length_penalty/over_rate: 0 means the threshold never binds.
length_penalty: false

# Penalty magnitude -- MARSHAL's `lower`. The main knob. clembench outcomes are
# SUCCESS +1 / FAILURE 0 / ABORTED -1, so 0.5 is already a strong counterweight.
length_penalty_coef: 0.4

# Turn-token count above which a generation is penalized -- MARSHAL's `max_len`.
# Set this near your per-turn --max-completion-length (e.g. 1536 for the Qwen3
# thinking runs) so only genuine overruns are charged, not ordinary reasoning.
length_penalty_max_len: 400

# Scale on the positive branch -- MARSHAL's `upper`. 0.0 (shipped) means short
# turns score exactly 0 rather than earning a bonus. Raising it PAYS the policy
# to be brief, which against a strict clembench parser can degenerate into empty
# answers that abort the turn; prefer leaving it at 0.
length_penalty_bonus: 0.0

# Origin of the penalty slope -- MARSHAL's `min_len` (11 comes from the shortest
# `<answer>X(i,j)</answer>` in their board games). Near-irrelevant while
# length_penalty_bonus is 0.
length_penalty_min_len: 11

# Vertical offset of the raw term -- MARSHAL's `coef`. Prefer changing
# length_penalty_max_len instead; this just moves the zero-crossing.
length_penalty_offset: 1.0
